name: tmail

services:
  db:
    image: postgres:15-alpine
    container_name: tmail-postgres-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tmail
    ports:
      - "5432:5432"
    networks:
      - tmail-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tmail"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI dashboard
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  smtp:
    build: ./smtp
    container_name: tmail-smtp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./smtp/mail:/mail
    environment:
      - API_PORT=2525
      - DATABASE_URL=postgresql://user:password@db:5432/tmail
    ports:
      - "2525:2525"
    networks:
      - tmail-network
    restart: unless-stopped
    pid: "host"

networks:
  tmail-network:
    driver: bridge

volumes:
  pgdata:
  rabbitmq_data:
