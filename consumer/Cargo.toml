[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
lapin = "4.10.0"
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
